name: PR Tests

on:
  pull_request:
    paths:
      - "calendar/**"
      - "calendarTests/**"
      - "calendarUITests/**"
      - "calendar.xcodeproj/**"
      - "Config.xcconfig.example"
      - "Info.plist"

jobs:
  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Create Config.xcconfig
        run: cp Config.xcconfig.example Config.xcconfig

      - name: Run tests
        run: |
          xcodebuild \
            -project calendar.xcodeproj \
            -scheme callisto \
            -configuration Debug \
            -destination 'platform=macOS' \
            build-for-testing \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=""
