name: PR Tests

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    paths:
      - "calendar/**"
      - "calendarTests/**"
      - "calendarUITests/**"
      - "calendar.xcodeproj/**"
      - "Config.xcconfig.example"
      - "Info.plist"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build for Testing
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-macos-ci' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Create Config.xcconfig
        run: cp Config.xcconfig.example Config.xcconfig

      - name: Build for testing
        run: |
          xcodebuild \
            -project calendar.xcodeproj \
            -scheme callisto \
            -configuration Debug \
            -destination 'platform=macOS' \
            build-for-testing \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=""
